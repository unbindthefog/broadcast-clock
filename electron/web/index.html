<!DOCTYPE html>
<html lang="de" data-format="hhmmss">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Broadcast Clock</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="drag-strip"></div>
  <div class="clock" id="clock">
    <div class="ring ring-hours" id="ringHours"></div>
    <div class="ring ring-seconds" id="ringSeconds"></div>
    <div class="face">
      <div class="time-text">
        <span id="hh"></span><span class="colon-char" id="colon1">:</span><span id="mm"></span><span class="seconds-group"><span class="colon-char" id="colon2">:</span><span id="ss"></span></span>
      </div>
    </div>
  </div>
  <script src="clock.js"></script>
</body>
</html>
